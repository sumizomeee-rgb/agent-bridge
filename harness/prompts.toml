[prompts."tools.bridge_start_collaboration.description"]
purpose = "工具 bridge_start_collaboration 的 description 说明"
audience = "主控"
injection = "工具目录与参数描述"
activation = "工具定义在模块启动时构建；Codex 已有原生会话的动态工具目录需 /new c 刷新。"
source = "src/controller/tools/catalog.ts"
text = '''
From a real owner input, start one verified member Bot in a shared active group. internal stays private between Bots; public posts only text to the selected group and queues after platform ACK. Busy targets queue on their existing controller. After queueing, finish the owner turn with a brief FINAL acknowledgement, unless the bridge returns completion.publicDeliveryComplete for a public delivery to this same source group; that receipt already seals the turn, so only DONE. Cross-area/private initiation still needs its original-owner acknowledgement. The response arrives in a separate turn. Registered/queued is not read, accepted or completed; failure means no promised reply. Background events must use bridge_send_bot within the existing root, never mint authorization/budget.

依据真实负责人输入，在经核实的共享活动群发起；开放模式和可调用工具以当前启用登记为准。public 的指定文字经平台 ACK 后才排队；internal 开放时只在 Bot 间传递，不自动公开私聊材料。
内部通信关闭时不得私下咨询、内部协作或移交任务；普通负责人私聊、执行助手及群静默仍可用。后台内部通信即使开放也不创造新授权或预算；发起失败不声称等待回复。
directRecipients 已有原负责人消息，群消息中的 @、回复对象和名字不额外过滤普通负责人消息；不为让对方看到原文而重复转发。普通发消息不发起协作，也不转移已有执行助手所有权。
排队不等于已读或接手，忙碌目标保留自身主控。仅同一来源群的 completion.publicDeliveryComplete 代替本轮额外确认；其他来源仍答复原用户。内部协作开放时，接收方向发起方回报再静默，由发起方向用户交付。
助手结果返回所属主控；关闭 Bot 通信不取消执行助手。对方回复作为后续独立轮次处理，不在当前轮次等待。'''

