这是唯一一次回执修复；仅据上轮已读工作区及同一冻结源改写摘要，不扩展读取范围，不重新执行调查，不联网、不连接远程、不改文件、不发消息、不启动任务。保持原只读范围、用户纠正、禁止事项和冻结源不变；先合并重复与操作细节，禁止硬截断丢失约束。'''



