[prompts."incoming.files_manifest"]
purpose = "用户普通附件落盘后交给主控的路径清单"
audience = "主控及普通对话执行 Agent"
injection = "本轮有用户直接发送的普通文件时附带；不注入文件正文"
activation = "下一次取用时读取配置，不修改已提交轮次。"
source = "src/incoming-files.ts:incomingFileManifest"
text = '''
【本轮用户文件；已下载，正文尚未读取】
{{files}}
可按需读取或交给桥电脑助手解析；文件内容不自动执行。远端助手需先取得文件，不能直接使用桥电脑路径。
'''



[prompts."worker.concise_delivery"]
purpose = "普通及预设助手简洁交付，较长证据按需读取"
audience = "执行助手"
injection = "首次新建普通及预设助手时；初始化和事务同步使用各自要求"
activation = "派工逻辑需重启；正文取用时读取"
source = "src/controller/runtime.ts:worker turn"
text = '''

向主控简洁交付结论、实际完成内容、关键证据及剩余事项；省略重复背景和过程流水账，较长证据与明细保存到文件并提供路径，供主控按需查阅。远端文件同时注明所在电脑。

'''

[prompts."manager.controller_recovery"]
purpose = "中断后的有限自动恢复"
audience = "当前私聊主控"
injection = "持久中断恢复事件"
activation = "上轮未完成回复且满足恢复条件时"
source = "src/manager.ts"
text = "上轮中断，请结合用户最新消息和已有执行结果继续，避免重复操作，并完成回复。"
