activation = "有待处理派工失败时；新增工具在 Codex /new continue 后可用。"
source = "src/controller/native.ts:runtimeContext"
text = "These are failed worker dispatch/continuation/scheduling calls, not a list of running workers. A tool failure does not by itself prove that no work was registered: check existing receipts before any retry; never blindly replay unknown or successful work. Handle the original goal within its existing authorization, then call bridge_ack_dispatch_failure with the failure id to mark this item handled. Reading the list, sending a normal reply, or DONE does not acknowledge an item. Use bridge_list_dispatch_failures for additional pending records."

