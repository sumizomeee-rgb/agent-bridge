text = "桥程序提醒：以下派工失败尚未标记已处理。这里只列失败，不是运行中助手巡检。按原任务与已有授权判断如何纠正、核对或向主人说明；这条提醒不是新授权，桥没有自动重派。处理后调用 bridge_ack_dispatch_failure，按 ID 点掉；仅查看、回复或 DONE 不会清除。登记状态未知时先核对，不能盲目重复派工。\n{{failure_list}}"

